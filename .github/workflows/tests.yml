name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'        # weekly, also checks that Splatalogue access still works
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']     # oldest and newest supported
    env:
      QT_QPA_PLATFORM: offscreen
      RUN_NETWORK_TESTS: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install ".[online,test]"
      - name: Test (installed package)
        run: python -m pytest -v
